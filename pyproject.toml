[project]
name = "codingagent"
version = "0.1.0"
description = "Terminal AI Coding Agent"
readme = "README.md"
authors = [
    { name = "Prateek-Khachi", email = "145461958+Prateek-Khachi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=2.52.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
codingagent = "coding_agent.main:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coding_agent"
